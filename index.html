<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Broadcast</title>
  </head>
  <body>
    <header>
      <h1>Weather Broadcast</h1>

      <input
        type="text"
        name="input"
        id="input"
        placeholder="Somewhere else?"
      />
      <input type="submit" name="submit" id="submit" value="Search" />
    </header>

    <main>
      <article>
        <h2 id="city">?</h2>
        <p id="city-info"></p>

        <h3>Today</h3>

        <p><span id="code-0">?</span></p>
        <p>
          Apparent Temperature:
          <span id="min-0">?</span> - <span id="max-0">?</span>
        </p>
        <p>Chance of Rain: <span id="rain-0">?</span></p>
      </article>
    </main>

    <script src="/js/main/display.js"></script>
    <script src="/js/main/rest.js"></script>

    <script src="/js/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Broadcast</title>

    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="header">
      <section class="header__section">
        <h1 class="header__title">Weather Broadcast</h1>

        <h2 id="header__city">?</h2>
        <p id="header__city-detail"><br /></p>
      </section>

      <section class="header__section">
        <input
          type="text"
          name="header__input"
          id="header__input"
          placeholder="Somewhere else?"
        />
        <input
          type="submit"
          name="header__submit"
          id="header__submit"
          value="Search"
        />
      </section>
    </header>

    <main class="main" id="main">
      <section class="days" id="days"></section>
    </main>

    <script src="/js/main/display.js"></script>
    <script src="/js/main/rest.js"></script>

    <script src="/js/main.js"></script>
  </body>
</html>
